# Synthetic hardware for compiling the T300 overlay with exact Klipper 0.12.0.

[stepper_x]
step_pin: gpio1
dir_pin: gpio2
enable_pin: gpio3
microsteps: 16
rotation_distance: 40
endstop_pin: gpio4
position_endstop: 0
position_max: 302
homing_speed: 50

[stepper_y]
step_pin: gpio5
dir_pin: gpio6
enable_pin: gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: gpio8
position_endstop: 0
position_max: 302
homing_speed: 50

[stepper_z]
step_pin: gpio9
dir_pin: gpio10
enable_pin: gpio11
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 370
position_min: -5

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: gpio14
microsteps: 16
rotation_distance: 3.55
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: Generic 3950
sensor_pin: analog0
control: pid
pid_Kp: 31.056
pid_Ki: 5.522
pid_Kd: 44.099
min_temp: 0
max_temp: 305
min_extrude_temp: 150
max_extrude_cross_section: 500
instantaneous_corner_velocity: 10
max_extrude_only_distance: 100
max_extrude_only_velocity: 2000
max_extrude_only_accel: 10000

[heater_bed]
heater_pin: gpio16
sensor_type: Generic 3950
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 105

[probe]
pin: gpio17
x_offset: 20
y_offset: -24
z_offset: 2.4
speed: 5

[filament_switch_sensor my_sensor]
switch_pin: gpio18
pause_on_runout: True
runout_gcode:
    M600

[safe_z_home]
home_xy_position: 130,165
z_hop: 5

[bed_mesh]
speed: 400
horizontal_move_z: 5
mesh_min: 20,0
mesh_max: 295,275
probe_count: 9,9
algorithm: bicubic

[adxl345]
cs_pin: gpio19

[resonance_tester]
accel_chip: adxl345
probe_points: 150,150,20
accel_per_hz: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 12000
max_z_velocity: 12
max_z_accel: 100

[virtual_sdcard]
path: /tmp

[pause_resume]

[display_status]

[respond]

[exclude_object]

[idle_timeout]
timeout: 600
gcode:
    RESPOND MSG="factory idle"

[force_move]
enable_force_move: True

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    BED_MESH_CALIBRATE_BASE ADAPTIVE=1

[gcode_macro START_PRINT]
variable_state: "Prepare"
gcode:
    G28

[gcode_macro END_PRINT]
gcode:
    TURN_OFF_HEATERS

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE

[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_state: "normal"
gcode:
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE

[gcode_macro DEFAULT_LOAD_FILAMENT]
gcode:
    G1 E60 F300

[gcode_macro DEFAULT_UNLOAD_FILAMENT]
gcode:
    G1 E-60 F300

[gcode_macro PRINTING_UNLOAD_FILAMENT]
gcode:
    G1 E-50 F600

[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro PAUSE_UNLOAD_FILAMENT]
gcode:
    PAUSE

[gcode_macro LOAD_FILAMENT_RESUME]
gcode:
    RESUME

[gcode_macro clear_last_file]
gcode:
    RESPOND MSG="cleared"

[gcode_macro RESUME_INTERRUPTED]
gcode:
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0

[gcode_macro M109]
rename_existing: M99109
gcode:
    M104 S{params.S}

[gcode_macro M190]
rename_existing: M99190
gcode:
    M140 S{params.S}

[include ../../../macros/t300_core.cfg]
