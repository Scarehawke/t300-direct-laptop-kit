name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax
        run: bash -n bin/t300-link
      - name: Compile Python helper
        run: python -m py_compile bin/t300ctl.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  klipper-next:
    name: Klipper master compatibility (reporting only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out this project
        uses: actions/checkout@v7
        with:
          path: project
      - name: Check out current Klipper master
        uses: actions/checkout@v7
        with:
          repository: Klipper3d/klipper
          ref: master
          fetch-depth: 1
          path: klipper-next
      - name: Check out pinned Mainsail client config
        uses: actions/checkout@v7
        with:
          repository: mainsail-crew/mainsail-config
          ref: ff3869a621db17ce3ef660adbbd3fa321995ac42
          fetch-depth: 1
          path: mainsail-config
      - name: Check out pinned KAMP
        uses: actions/checkout@v7
        with:
          repository: kyleisah/Klipper-Adaptive-Meshing-Purging
          ref: b0dad8ec9ee31cb644b94e39d4b8a8fb9d6c9ba0
          fetch-depth: 1
          path: kamp
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install current Klipper test dependencies
        run: python -m pip install --requirement klipper-next/scripts/klippy-requirements.txt
      - name: Exercise production policy on current master
        run: >-
          python project/bin/test-klipper-v013-mainline.py
          --mode next
          --klipper-source klipper-next
          --mainsail-config-source mainsail-config
          --kamp-source kamp
          --report project/.cache/klipper-next-report.json
      - name: Summarize compatibility result
        if: always()
        working-directory: project
        run: |
          echo '## Klipper master compatibility (non-deploying)' >> "$GITHUB_STEP_SUMMARY"
          if test -f .cache/klipper-next-report.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .cache/klipper-next-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The compatibility harness did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
