# Deliberately separate maintenance configuration. This file has no Moonraker
# service and is reachable only through the root-owned local Klippy input FIFO.
# Starting its service stops and conflicts with production Klipper.

[include ../klipper/local/identity.cfg]
[include ../klipper/hardware.cfg]
[include ../klipper/machine.cfg]
[include ../klipper/local/calibration.cfg]
[include resonance.cfg]

# Owner-supplied GerGo is the only supported gantry-adjustment workflow. Keep
# it here, outside normal printing, because it is an attended maintenance task.
[include ../klipper/private/*.cfg]

[force_move]
enable_force_move: True

[gcode_macro T_MAINTENANCE_STATUS]
gcode:
  RESPOND TYPE=error MSG="Maintenance mode is active; production safeguards and network control are unavailable."
