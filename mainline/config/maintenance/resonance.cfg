# The stock screen's SPI accelerometer is connected only in attended,
# network-isolated maintenance mode. Optional sweep parameters use Klipper's
# pinned upstream defaults rather than the vendor's unusually aggressive ones.
[mcu host]
serial: /run/t300-host-mcu/klipper_host_mcu

[adxl345]
cs_pin: host:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
  150, 150, 20
