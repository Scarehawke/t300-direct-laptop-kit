[virtual_sdcard]
path: /var/lib/t300/moonraker-data/gcodes
on_error_gcode:
  CANCEL_PRINT

[pause_resume]
recover_velocity: 50

[display_status]
[respond]
[exclude_object]
[gcode_arcs]
resolution: 1.0

[safe_z_home]
home_xy_position: 130, 165
speed: 80
z_hop: 5
z_hop_speed: 5

[bed_mesh]
speed: 400
horizontal_move_z: 5
mesh_min: 20, 0
mesh_max: 295, 275
probe_count: 9, 9
algorithm: bicubic
bicubic_tension: 0.2
split_delta_z: 0.0125
mesh_pps: 3, 3
move_check_distance: 3
fade_start: 0
fade_end: 10
fade_target: 0

[filament_switch_sensor filament_runout]
switch_pin: PC4
pause_on_runout: False
runout_gcode:
  T_FILAMENT_RUNOUT
event_delay: 3
pause_delay: 0.5

[idle_timeout]
timeout: 600
gcode:
  TURN_OFF_HEATERS
  M107
  RESPOND TYPE=echo MSG="Idle for ten minutes: heaters and part fan are off; motors remain enabled."
