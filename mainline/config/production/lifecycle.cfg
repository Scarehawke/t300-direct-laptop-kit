# The pinned Mainsail client owns PAUSE, RESUME, and CANCEL_PRINT. These
# variables provide T300-specific parking while retaining its tested state
# handling.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: False
variable_custom_park_x: 297.0
variable_custom_park_y: 297.0
variable_custom_park_dz: 5.0
variable_retract: 0.8
# Mainsail performs its normal cancel retraction before TURN_OFF_HEATERS.
# Keep that movement at zero; our cancel hook retracts only after heater
# targets are off and only while Klipper still reports extrusion as safe.
variable_cancel_retract: 0.0
variable_speed_retract: 35.0
variable_unretract: 0.8
variable_speed_unretract: 35.0
variable_speed_hop: 12.0
variable_speed_move: 100.0
variable_park_at_cancel: False
variable_park_at_cancel_x: None
variable_park_at_cancel_y: None
variable_use_fw_retract: False
variable_idle_timeout: 0
variable_runout_sensor: "filament_switch_sensor filament_runout"
variable_user_pause_macro: ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_T_CANCEL_PARK"
gcode:

[gcode_macro _T_VALIDATE_PURGE_LANE]
description: Refuse an object layout that leaves KAMP nowhere safe to purge
gcode:
  {% set settings = printer["gcode_macro _KAMP_Settings"] %}
  {% set margin = settings.purge_margin|float %}
  {% set amount = settings.purge_amount|float %}
  {% set breakaway = 10.0 %}
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% set x_min = all_points | map(attribute=0) | min | default(0) %}
  {% set y_min = all_points | map(attribute=1) | min | default(0) %}
  {% set has_front_lane = y_min >= margin and printer.toolhead.axis_maximum.x >= amount + breakaway %}
  {% set has_left_lane = x_min >= margin and printer.toolhead.axis_maximum.y >= amount + breakaway %}
  {% if not has_front_lane and not has_left_lane %}
    {action_raise_error("KAMP purge refused before heating: objects leave no bounded front or left purge lane.")}
  {% endif %}

[gcode_macro BUILD_PLATE_READY]
description: Confirm the removable build plate is clean, fitted, clipped, and clear
gcode:
  {% if printer.t300_safety.commissioning_lock %}
    {action_raise_error("Printing and homing remain disabled during commissioning")}
  {% endif %}
  {% if printer.virtual_sdcard.file_path is not none %}
    {action_raise_error("A print is loaded. Cancel it before checking the build plate again")}
  {% endif %}
  {% if printer.t300_safety.build_plate_ready %}
    RESPOND TYPE=echo MSG="Build plate is already marked clean, fitted, clipped, and clear."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Build Plate Safety Check"
    RESPOND TYPE=command MSG="action:prompt_text Fit the magnetic steel sheet flat, latch both rear clips, clean the print surface, remove loose filament, and clear the bed and toolhead path."
    RESPOND TYPE=command MSG="action:prompt_footer_button ✓ Cleaned and rearmed|_T_CONFIRM_BUILD_PLATE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Not yet|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _T_CONFIRM_BUILD_PLATE]
description: Hidden build-plate prompt action
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  T_CONFIRM_STEEL_SHEET CONFIRM=YES

[gcode_macro HOME_PRINTER]
description: Home all axes through the reviewed build-plate safety check
gcode:
  {% if printer.t300_safety.commissioning_lock %}
    {action_raise_error("Homing remains disabled during commissioning")}
  {% endif %}
  {% if printer.virtual_sdcard.file_path is not none %}
    {action_raise_error("Homing is disabled while a print is loaded or paused")}
  {% endif %}
  {% if printer.t300_safety.build_plate_ready %}
    G28
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Home T300"
    RESPOND TYPE=command MSG="action:prompt_text All axes will move. Fit and clean the magnetic steel sheet, latch both rear clips, and clear hands, tools, filament, and parts from the full motion path."
    RESPOND TYPE=command MSG="action:prompt_footer_button ✓ Cleaned and rearmed, home now|_T_CONFIRM_AND_HOME|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Not yet|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _T_CONFIRM_AND_HOME]
description: Hidden homing prompt action
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  T_CONFIRM_STEEL_SHEET CONFIRM=YES
  G28

[gcode_macro START_PRINT]
description: Verified T300 print startup with full mesh and moving KAMP purge
gcode:
  {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
    {action_raise_error("START_PRINT requires BED_TEMP and EXTRUDER_TEMP")}
  {% endif %}
  {% set bed = params.BED_TEMP|float %}
  {% set nozzle = params.EXTRUDER_TEMP|float %}
  {% if bed < 0 or bed > 100 %}
    {action_raise_error("BED_TEMP is outside the T300 production range")}
  {% endif %}
  {% if nozzle < 150 or nozzle > 300 %}
    {action_raise_error("EXTRUDER_TEMP is outside the T300 production range")}
  {% endif %}
  {% if printer.exclude_object.objects|length == 0 %}
    {action_raise_error("No Orca object definitions were found; adaptive purge refused")}
  {% endif %}
  {% if not printer.t300_safety.build_plate_ready %}
    {action_raise_error("Build plate check required; use Build Plate Ready before selecting a file")}
  {% endif %}

  SET_PRESSURE_ADVANCE ADVANCE=0
  _T_VALIDATE_PURGE_LANE
  T_RESERVE_PRINT_HOME
  M140 S{bed}
  M104 S150
  M190 S{bed}
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  SMART_PARK
  M109 S{nozzle}
  LINE_PURGE

[gcode_macro _T_SAFE_PARK]
description: Lift first, then park without ever lowering the toolhead
gcode:
  {% set z_min = params.Z_MIN|default(200)|float %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set target_z = [[current_z + 5.0, z_min]|max, max_z]|min %}
    SAVE_GCODE_STATE NAME=_t300_safe_park
    G90
    G1 Z{target_z} F720
    {% if target_z - current_z >= 2.0 %}
      G1 X297 Y297 F6000
    {% else %}
      RESPOND TYPE=echo MSG="XY park skipped because less than 2 mm of safe Z clearance remained."
    {% endif %}
    RESTORE_GCODE_STATE NAME=_t300_safe_park MOVE=0
  {% else %}
    RESPOND TYPE=echo MSG="Safe park skipped because all axes are not homed."
  {% endif %}

[gcode_macro _T_RETRACT_IF_HOT]
description: Retract only when upstream Klipper reports extrusion is safe
gcode:
  {% set length = params.LENGTH|default(1.0)|float|abs %}
  {% if printer.toolhead.extruder != '' and printer[printer.toolhead.extruder].can_extrude %}
    SAVE_GCODE_STATE NAME=_t300_retract
    M83
    G1 E-{length} F2100
    RESTORE_GCODE_STATE NAME=_t300_retract MOVE=0
  {% endif %}

[gcode_macro _T_CANCEL_PARK]
description: Mainsail CANCEL_PRINT hook; heaters are already off at this point
gcode:
  T_MARK_BUILD_PLATE_DIRTY
  _T_RETRACT_IF_HOT LENGTH=1.0
  SET_PRESSURE_ADVANCE ADVANCE=0
  _T_SAFE_PARK Z_MIN=200

[gcode_macro END_PRINT]
description: T300 normal completion with hot-only retract and clearance-aware park
gcode:
  M400
  T_MARK_BUILD_PLATE_DIRTY
  _T_RETRACT_IF_HOT LENGTH=1.0
  TURN_OFF_HEATERS
  SET_PRESSURE_ADVANCE ADVANCE=0
  M107
  _T_SAFE_PARK Z_MIN=200
  BED_MESH_CLEAR
  RESPOND TYPE=echo MSG="Print complete; heaters and part fan are off."

[gcode_macro T_STATUS]
description: Show read-only T300 temperatures and safety state
gcode:
  {% set sensor = printer["filament_switch_sensor filament_runout"] %}
  {% set axes = printer.toolhead.homed_axes|upper %}
  {% set plate = "Ready" if printer.t300_safety.build_plate_ready else "Check required" %}
  {% set lock = "Locked" if printer.t300_safety.commissioning_lock else "Released" %}
  {% set filament = "Present" if sensor.filament_detected else "Not detected" %}
  RESPOND TYPE=command MSG="action:prompt_begin T300 Status"
  RESPOND TYPE=command MSG="action:prompt_text Nozzle {printer.extruder.temperature|round(1)} / {printer.extruder.target|round(1)} C | Bed {printer.heater_bed.temperature|round(1)} / {printer.heater_bed.target|round(1)} C | Homed {axes if axes else 'None'} | Plate {plate} | Commissioning {lock} | Filament {filament}"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro T_FILAMENT_RUNOUT]
description: Pause once when the stock runout switch reports no filament
gcode:
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="Filament runout detected."
    PAUSE X=297 Y=297 Z_MIN=50
  {% else %}
    RESPOND TYPE=echo MSG="Runout received while already paused; no second pause issued."
  {% endif %}

[gcode_macro M600]
description: Pause safely for an attended filament change
gcode:
  T_MARK_BUILD_PLATE_DIRTY
  {% if not printer.pause_resume.is_paused %}
    PAUSE X=297 Y=297 Z_MIN=50
  {% else %}
    RESPOND TYPE=echo MSG="Printer is already paused for filament handling."
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Attended load; available only while paused and hot
gcode:
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("Pause the print before loading filament")}
  {% endif %}
  {% if printer.toolhead.extruder == '' or not printer[printer.toolhead.extruder].can_extrude %}
    {action_raise_error("Hotend is too cold to load filament")}
  {% endif %}
  {% set length = params.LENGTH|default(40)|float %}
  {% if length <= 0 or length > 100 %}
    {action_raise_error("LOAD length must be greater than 0 and at most 100 mm")}
  {% endif %}
  T_MARK_BUILD_PLATE_DIRTY
  SAVE_GCODE_STATE NAME=_t300_load
  M83
  G1 E{length} F300
  RESTORE_GCODE_STATE NAME=_t300_load MOVE=0

[gcode_macro UNLOAD_FILAMENT]
description: Attended unload; available only while paused and hot
gcode:
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("Pause the print before unloading filament")}
  {% endif %}
  {% if printer.toolhead.extruder == '' or not printer[printer.toolhead.extruder].can_extrude %}
    {action_raise_error("Hotend is too cold to unload filament")}
  {% endif %}
  {% set length = params.LENGTH|default(80)|float %}
  {% if length <= 0 or length > 100 %}
    {action_raise_error("UNLOAD length must be greater than 0 and at most 100 mm")}
  {% endif %}
  T_MARK_BUILD_PLATE_DIRTY
  SAVE_GCODE_STATE NAME=_t300_unload
  M83
  G1 E-2 F600
  G1 E-{length} F1800
  RESTORE_GCODE_STATE NAME=_t300_unload MOVE=0
