# The T300 uses one non-parking frame request per sliced layer. Rendering,
# storage limits, and camera failures are handled by the fail-soft Moonraker
# component; this printer-side macro cannot move, pause, heat, or extrude.
[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Request one non-moving timelapse frame
gcode:
  {action_call_remote_method("timelapse_newframe", macropark=False, hyperlapse=False)}
