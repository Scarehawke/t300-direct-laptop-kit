# Local framebuffer/DRM display policy. Device selection remains automatic so
# the USB candidate can prove whether the Klipad exposes fbdev or DRM. The
# service itself supplies the local-only transport and authentication flags.

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "ServerLayout"
    Identifier "T300 local display"
EndSection
