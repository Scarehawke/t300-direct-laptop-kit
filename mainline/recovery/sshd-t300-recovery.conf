# Complete, standalone marked-T300 recovery SSH configuration. This file has
# no Include directives and is selected explicitly by ssh.service.
Port 22
AddressFamily inet
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
UsePAM no
StrictModes yes
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
GSSAPIAuthentication no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
DisableForwarding yes
PermitTunnel no
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
MaxAuthTries 3
MaxSessions 1
LoginGraceTime 30
MaxStartups 2:30:2
LogLevel VERBOSE
AllowUsers root
AuthorizedKeysFile /etc/t300-recovery-authorized_keys
ForceCommand /usr/local/sbin/t300-recovery-ssh-gate
