# Preliminary T300 runtime overlay. Review-only; do not install yet.
# Load after the pinned Mainsail client component and all factory sections.

[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
        M104 S0
        M106 S0
        RESPOND TYPE=echo MSG="Paused for one hour. Hotend and part fan turned off, bed and motors remain enabled"
    {% else %}
        TURN_OFF_HEATERS
        M106 S0
        RESPOND TYPE=echo MSG="Idle for 10 minutes. Heaters and part fan turned off, motors remain enabled"
    {% endif %}

[extruder]
# KAMP Line Purge requires at least 5 mm2. Keep every other vendor value.
max_extrude_cross_section: 5

[force_move]
enable_force_move: False

[filament_switch_sensor my_sensor]
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="Filament runout. Print paused, load filament, then resume"

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 10.0
variable_custom_park_y: 290.0
variable_custom_park_dz: 5.0
variable_retract: 1.0
variable_cancel_retract: 1.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 35.0
variable_speed_hop: 10.0
variable_speed_move: 100.0
variable_park_at_cancel: False
variable_use_fw_retract: False
variable_idle_timeout: 3600
variable_runout_sensor: "filament_switch_sensor my_sensor"
variable_user_pause_macro: ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_T_RUNTIME_CANCEL_EXIT"
gcode:

[gcode_macro START_PRINT]
description: Validated T300 heat, mesh, park, and moving-purge sequence
gcode:
    {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
        {action_raise_error("START_PRINT requires BED_TEMP and EXTRUDER_TEMP")}
    {% endif %}
    {% set bed_temp = params.BED_TEMP|float %}
    {% set nozzle_temp = params.EXTRUDER_TEMP|float %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|float %}
    {% set nozzle_min = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set nozzle_max = printer.configfile.settings.extruder.max_temp|float %}
    {% if bed_temp < 0 or bed_temp > bed_max - 5 %}
        {action_raise_error("BED_TEMP is outside the configured safe range")}
    {% endif %}
    {% if nozzle_temp < nozzle_min or nozzle_temp > nozzle_max - 5 %}
        {action_raise_error("EXTRUDER_TEMP is outside the configured safe range")}
    {% endif %}
    {% if printer['filament_switch_sensor my_sensor'].enabled and
          not printer['filament_switch_sensor my_sensor'].filament_detected %}
        {action_raise_error("No filament detected. Insert filament before starting")}
    {% endif %}

    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    M220 S100
    M221 S100
    G90
    M83
    M140 S{bed_temp}
    M104 S150
    M99190 S{bed_temp}
    G28
    BED_MESH_CALIBRATE BED_TEMP={bed_temp}
    M140 S{bed_temp}
    M190 S{bed_temp}
    SMART_PARK
    M99109 S{nozzle_temp}
    LINE_PURGE
    M400
    G90
    M83
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Start"'
    M117 Printing

[gcode_macro END_PRINT]
description: Cool and park with bounded clearance for nozzle cleaning
gcode:
    M400
    _CLIENT_RETRACT LENGTH=1.0
    TURN_OFF_HEATERS
    M106 S0
    _T_RUNTIME_SAFE_EXIT
    M220 S100
    M221 S100
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    clear_last_file
    M117 Print complete

[gcode_macro _T_RUNTIME_SAFE_EXIT]
description: Move only known axes to a bounded cleaning position
gcode:
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% if "xyz" in homed %}
        {% set origin = printer.gcode_move.homing_origin %}
        {% set current_z = printer.gcode_move.gcode_position.z|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float - origin.z|float %}
        {% set clean_z = [[current_z + 10.0, 200.0]|max, max_z]|min %}
        G90
        {% if clean_z > current_z %}
            G1 Z{clean_z} F600
        {% endif %}
        G1 X10 Y290 F6000
    {% else %}
        RESPOND TYPE=echo MSG="Cleanup park skipped: all axes are not homed"
    {% endif %}

[gcode_macro _T_RUNTIME_CANCEL_EXIT]
description: Schedule cleanup after Mainsail completes native cancellation
gcode:
    UPDATE_DELAYED_GCODE ID=_T_RUNTIME_CANCEL_POST DURATION=0.1

[delayed_gcode _T_RUNTIME_CANCEL_POST]
gcode:
    _T_RUNTIME_SAFE_EXIT
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    clear_last_file
    M117 Print cancelled

[gcode_macro T_RELEASE_MOTORS]
description: Explicitly release motors while no print is active
gcode:
    {% set state = printer.print_stats.state|lower %}
    {% if state == "printing" or state == "paused" or printer.pause_resume.is_paused %}
        {action_raise_error("Motor release is blocked while a print is active or paused")}
    {% endif %}
    M84
    RESPOND TYPE=echo MSG="Motors released. Home before any positioned move"

[gcode_macro M600]
description: Pause and park high enough for an attended filament change
gcode:
    PAUSE X=10 Y=290 Z_MIN=50

[gcode_macro DEFAULT_LOAD_FILAMENT]
description: Load filament while preserving coordinate and extrusion modes
gcode:
    {% if printer.print_stats.state|lower == "printing" %}
        {action_raise_error("Pause the print before loading filament")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before loading filament")}
    {% endif %}
    SAVE_GCODE_STATE NAME=t300_load_state
    M83
    G1 E60 F300
    G4 P700
    RESTORE_GCODE_STATE NAME=t300_load_state

[gcode_macro DEFAULT_UNLOAD_FILAMENT]
description: Unload filament while preserving coordinate and extrusion modes
gcode:
    {% if printer.print_stats.state|lower == "printing" %}
        {action_raise_error("Pause the print before unloading filament")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before unloading filament")}
    {% endif %}
    SAVE_GCODE_STATE NAME=t300_unload_state
    M83
    G1 E20 F300
    G1 E-20 F900
    G1 E-40 F180
    G4 P700
    RESTORE_GCODE_STATE NAME=t300_unload_state

[gcode_macro PRINTING_UNLOAD_FILAMENT]
description: Touchscreen-compatible hot unload
gcode:
    DEFAULT_UNLOAD_FILAMENT

[gcode_macro PAUSE_UNLOAD_FILAMENT]
description: Touchscreen-compatible attended filament-change pause
gcode:
    M600

[gcode_macro LOAD_FILAMENT_RESUME]
description: Resume after filament has been loaded and the sensor is clear
gcode:
    RESUME

[gcode_macro RESUME_INTERRUPTED]
description: Disabled until the stock T300 recovery path can establish coordinates safely
gcode:
    {action_raise_error("Power-loss resume is quarantined: home and restart the print normally")}
