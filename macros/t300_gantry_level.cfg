# T300 Direct Gantry Level
#
# An original, open-source measurement macro for the Sovol/Comgrow T300.
# The T300's two Z motors share one driver, so Klipper cannot adjust the sides
# independently. This macro probes near the right and left sides, reports the
# measured difference, and tells the operator how far to turn the stock right
# Z leadscrew knob.
#
# Run from Mainsail while standing beside the printer:
#   GANTRY_LEVEL_T300 BED_TEMP=60 TOLERANCE=0.02
#
# After an adjustment, run the macro again. It homes before every measurement.
# When the two sides are within tolerance it re-homes and leaves the motors
# enabled so BED_MESH_CALIBRATE can follow immediately.

[gcode_macro GANTRY_LEVEL_T300]
description: Measure T300 X-gantry tilt and report the right-knob adjustment
variable_right_z: 0.0
variable_left_x: 0.0
variable_right_x: 0.0
variable_probe_y: 0.0
variable_safe_z: 10.0
variable_rotation_distance: 8.0
variable_run_tolerance: 0.02
gcode:
  {% set cfg = printer.configfile.settings %}
  {% if "probe" not in cfg %}
    { action_raise_error("GANTRY_LEVEL_T300 requires a [probe] section") }
  {% endif %}
  {% if "bed_mesh" not in cfg %}
    { action_raise_error("GANTRY_LEVEL_T300 requires a [bed_mesh] section") }
  {% endif %}
  {% if "stepper_x" not in cfg or "stepper_y" not in cfg or "stepper_z" not in cfg %}
    { action_raise_error("GANTRY_LEVEL_T300 requires Cartesian stepper_x/y/z sections") }
  {% endif %}
  {% if printer.print_stats is defined and printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("GANTRY_LEVEL_T300 cannot run during a print") }
  {% endif %}

  {% set mesh_min = cfg["bed_mesh"].mesh_min %}
  {% set mesh_max = cfg["bed_mesh"].mesh_max %}
  {% set mesh_x_min = mesh_min[0]|float %}
  {% set mesh_y_min = mesh_min[1]|float %}
  {% set mesh_x_max = mesh_max[0]|float %}
  {% set mesh_y_max = mesh_max[1]|float %}
  {% set span_x = mesh_x_max - mesh_x_min %}
  {% set edge_margin = span_x * 0.05 if span_x * 0.05 > 5.0 else 5.0 %}
  {% set probe_left = mesh_x_min + edge_margin %}
  {% set probe_right = mesh_x_max - edge_margin %}
  {% set probe_middle_y = (mesh_y_min + mesh_y_max) / 2.0 %}
  {% set probe_x_offset = cfg["probe"].x_offset|default(0.0)|float %}
  {% set probe_y_offset = cfg["probe"].y_offset|default(0.0)|float %}
  {% set nozzle_left = probe_left - probe_x_offset %}
  {% set nozzle_right = probe_right - probe_x_offset %}
  {% set nozzle_y = probe_middle_y - probe_y_offset %}
  {% set x_min = cfg["stepper_x"].position_min|default(0.0)|float %}
  {% set x_max = cfg["stepper_x"].position_max|float %}
  {% set y_min = cfg["stepper_y"].position_min|default(0.0)|float %}
  {% set y_max = cfg["stepper_y"].position_max|float %}
  {% set rotation_distance = cfg["stepper_z"].rotation_distance|float %}
  {% set tolerance = params.TOLERANCE|default(0.02)|float %}
  {% set bed_temp = params.BED_TEMP|default(60)|float %}

  {% if span_x <= 40.0 or mesh_y_max <= mesh_y_min %}
    { action_raise_error("GANTRY_LEVEL_T300 found an invalid bed_mesh area") }
  {% endif %}
  {% if nozzle_left < x_min or nozzle_right > x_max or nozzle_y < y_min or nozzle_y > y_max %}
    { action_raise_error("Calculated probe moves exceed the configured axis limits") }
  {% endif %}
  {% if rotation_distance <= 0.0 %}
    { action_raise_error("stepper_z rotation_distance must be positive") }
  {% endif %}
  {% if tolerance < 0.005 or tolerance > 0.10 %}
    { action_raise_error("TOLERANCE must be between 0.005 and 0.10 mm") }
  {% endif %}
  {% if bed_temp < 0.0 or bed_temp > 100.0 %}
    { action_raise_error("BED_TEMP must be between 0 and 100 C") }
  {% endif %}

  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=left_x VALUE={nozzle_left}
  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=right_x VALUE={nozzle_right}
  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=probe_y VALUE={nozzle_y}
  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=rotation_distance VALUE={rotation_distance}
  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=run_tolerance VALUE={tolerance}

  SAVE_GCODE_STATE NAME=t300_gantry_level_state
  {% if bed_temp > 0.0 %}
    M190 S{bed_temp}
  {% endif %}
  G28
  G90
  G1 Z10 F600
  G1 X{nozzle_right} Y{nozzle_y} F6000
  PROBE SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.020 SAMPLES_TOLERANCE_RETRIES=3
  _TGL_CAPTURE_RIGHT

[gcode_macro _TGL_CAPTURE_RIGHT]
gcode:
  {% set state = printer["gcode_macro GANTRY_LEVEL_T300"] %}
  {% set right_z = printer.probe.last_z_result|float %}
  SET_GCODE_VARIABLE MACRO=GANTRY_LEVEL_T300 VARIABLE=right_z VALUE={right_z}
  G90
  G1 Z{state.safe_z} F600
  G1 X{state.left_x} Y{state.probe_y} F6000
  PROBE SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.020 SAMPLES_TOLERANCE_RETRIES=3
  _TGL_REPORT

[gcode_macro _TGL_REPORT]
gcode:
  {% set state = printer["gcode_macro GANTRY_LEVEL_T300"] %}
  {% set left_z = printer.probe.last_z_result|float %}
  {% set delta = state.right_z|float - left_z %}
  {% set difference = delta|abs %}
  {% set turns = difference / (state.rotation_distance|float) %}
  {% set degrees = turns * 360.0 %}
  {% set clock_minutes = turns * 60.0 %}

  G90
  G1 Z{state.safe_z} F600
  RESTORE_GCODE_STATE NAME=t300_gantry_level_state

  {% if difference <= state.run_tolerance|float %}
    { action_respond_info("T300 gantry level: left %.4f, right %.4f, difference %.4f mm. PASS." % (left_z, state.right_z|float, difference)) }
    M117 Gantry level PASS
    G28
  {% elif delta > 0.0 %}
    { action_respond_info("T300 gantry: RIGHT SIDE IS LOW. Raise the right side by %.4f mm (about %.2f degrees / %.2f clock-minutes on the right knob), then run GANTRY_LEVEL_T300 again." % (difference, degrees, clock_minutes)) }
    M117 Raise RIGHT side
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
  {% else %}
    { action_respond_info("T300 gantry: RIGHT SIDE IS HIGH. Lower the right side by %.4f mm (about %.2f degrees / %.2f clock-minutes on the right knob), then run GANTRY_LEVEL_T300 again." % (difference, degrees, clock_minutes)) }
    M117 Lower RIGHT side
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
  {% endif %}
