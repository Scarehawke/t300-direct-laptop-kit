# QUARANTINED: locally authored and not approved for installation or printing.
# T300 core safety and lifecycle overlay, release candidate 3.
# Requires the stock firmware 1.5.2 Macro.cfg to be included first.

[idle_timeout]
timeout: 600
gcode:
    TURN_OFF_HEATERS
    M107
    M84
    RESPOND TYPE=echo MSG="Idle for 10 minutes: heaters and motors turned off"

[extruder]
max_extrude_cross_section: 1.0
instantaneous_corner_velocity: 1.0
max_extrude_only_velocity: 60
max_extrude_only_accel: 3000

[force_move]
enable_force_move: False

[resonance_tester]
accel_per_hz: 75

[gcode_macro T_CORE_STATUS]
description: Report the installed T300 core overlay version
gcode:
    RESPOND TYPE=echo MSG="T300 core 0.1.0-rc3 loaded, power-loss resume quarantined"

[gcode_macro RESUME_INTERRUPTED]
description: Disabled until the vendor recovery scripts are fully audited
gcode:
    {action_raise_error("Power-loss resume is quarantined. Restart this print from the beginning")}

[gcode_macro BED_MESH_CALIBRATE]
description: Heat to the requested bed temperature and forward mesh parameters
gcode:
    {% set bed_temp = params.BED_TEMP|default(65)|float %}
    {% if bed_temp < 0 or bed_temp > 100 %}
        {action_raise_error("BED_TEMP must be between 0 and 100 C")}
    {% endif %}
    M140 S{bed_temp}
    M99190 S{bed_temp}
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE_BASE{% for key in params %}{% if key|upper != "BED_TEMP" %} {key}={params[key]}{% endif %}{% endfor %}

[gcode_macro START_PRINT]
description: Parameter-driven T300 heat, home, mesh, and moving purge sequence
gcode:
    {% set bed_temp = params.BED_TEMP|default(printer.heater_bed.target)|float %}
    {% set nozzle_temp = params.EXTRUDER_TEMP|default(printer.extruder.target)|float %}
    {% set soak_seconds = params.SOAK_SECONDS|default(0)|int %}
    {% set mesh_mode = params.MESH|default("FULL")|upper %}
    {% set mesh_profile = params.MESH_PROFILE|default("default")|string %}
    {% if bed_temp <= 0 %}
        {% set bed_temp = 60.0 %}
        {action_respond_info("START_PRINT received no bed target, using 60 C")}
    {% endif %}
    {% if nozzle_temp <= 0 %}
        {% set nozzle_temp = 200.0 %}
        {action_respond_info("START_PRINT received no nozzle target, using 200 C")}
    {% endif %}
    {% if bed_temp < 0 or bed_temp > 100 %}
        {action_raise_error("BED_TEMP must be between 0 and 100 C")}
    {% endif %}
    {% if nozzle_temp < 150 or nozzle_temp > 300 %}
        {action_raise_error("EXTRUDER_TEMP must be between 150 and 300 C")}
    {% endif %}
    {% if soak_seconds < 0 or soak_seconds > 600 %}
        {action_raise_error("SOAK_SECONDS must be between 0 and 600")}
    {% endif %}
    {% if mesh_mode not in ["FULL", "SAVED", "NONE"] %}
        {action_raise_error("MESH must be FULL, SAVED, or NONE")}
    {% endif %}

    CLEAR_PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=600
    M220 S100
    M221 S100
    G90
    M83
    M140 S{bed_temp}
    M104 S0
    M99190 S{bed_temp}
    {% if soak_seconds > 0 %}
        G4 P{soak_seconds * 1000}
    {% endif %}
    G28
    {% if mesh_mode == "FULL" %}
        BED_MESH_CALIBRATE BED_TEMP={bed_temp}
    {% elif mesh_mode == "SAVED" %}
        BED_MESH_CLEAR
        BED_MESH_PROFILE LOAD={mesh_profile}
    {% else %}
        BED_MESH_CLEAR
    {% endif %}

    G90
    G1 Z10 F600
    G1 X20 Y20 F6000
    M99109 S{nozzle_temp}
    M83
    G92 E0
    G1 Z0.30 F600
    G1 Y100 E7 F1200
    G1 X20.8 F3000
    G1 Y20 E7 F1200
    G1 E-0.5 F3000
    G1 Z2 F600
    G92 E0
    M117 Printing

[gcode_macro END_PRINT]
description: Safely finish, cool, park, and release the printer
gcode:
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% set can_extrude = printer.extruder.can_extrude %}
    {% set z_space = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set z_lift = [10.0, z_space]|min %}
    M400
    {% if can_extrude %}
        M83
        G1 E-1 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M107
    {% if homed == "xyz" %}
        {% if z_lift > 0 %}
            G91
            G1 Z{z_lift} F600
            G90
        {% endif %}
        G1 X10 Y290 F6000
    {% endif %}
    M84
    M220 S100
    M221 S100
    CLEAR_PAUSE
    {% if "gcode_macro clear_last_file" in printer %}
        clear_last_file
    {% endif %}
    M117 Print complete

[gcode_macro PAUSE]
description: Pause with a bounded lift and park move
gcode:
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% set can_extrude = printer.extruder.can_extrude %}
    {% set z_space = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set z_lift = [5.0, z_space]|min %}
    {% if printer.pause_resume.is_paused %}
        {action_respond_info("Print is already paused")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp VALUE={printer.extruder.target|float}
        PAUSE_BASE
        {% if can_extrude %}
            M83
            G1 E-1 F1800
        {% endif %}
        {% if homed == "xyz" %}
            {% if z_lift > 0 %}
                G91
                G1 Z{z_lift} F600
                G90
            {% endif %}
            G1 X10 Y290 F6000
        {% else %}
            {action_respond_info("Axes are not fully homed, paused without a park move")}
        {% endif %}
        M117 Paused
    {% endif %}

[gcode_macro RESUME]
description: Reheat, prime, and return to a safely paused print
variable_extruder_temp: 0
gcode:
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% set resume_temp = printer["gcode_macro RESUME"].extruder_temp|float %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set velocity = params.VELOCITY|default(50)|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("The printer is not paused")}
    {% endif %}
    {% if homed != "xyz" %}
        {action_raise_error("Position was lost while paused. Cancel and restart the print")}
    {% endif %}
    {% if "filament_switch_sensor my_sensor" in printer and
          printer["filament_switch_sensor my_sensor"].enabled and
          not printer["filament_switch_sensor my_sensor"].filament_detected %}
        {action_raise_error("Insert filament before resuming")}
    {% endif %}
    {% if resume_temp >= min_temp %}
        M99109 S{resume_temp}
        M83
        G1 E1 F300
    {% endif %}
    RESUME_BASE VELOCITY={velocity}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp VALUE=0
    M117 Printing

[gcode_macro CANCEL_PRINT]
description: Cancel first, then cool and move only when position is known
gcode:
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% set can_extrude = printer.extruder.can_extrude %}
    {% set z_space = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set z_lift = [10.0, z_space]|min %}
    CANCEL_PRINT_BASE
    TURN_OFF_HEATERS
    M107
    {% if can_extrude %}
        M83
        G1 E-1 F1800
    {% endif %}
    {% if homed == "xyz" %}
        {% if z_lift > 0 %}
            G91
            G1 Z{z_lift} F600
            G90
        {% endif %}
        G1 X10 Y290 F6000
    {% endif %}
    M84
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp VALUE=0
    {% if "gcode_macro clear_last_file" in printer %}
        clear_last_file
    {% endif %}
    M117 Print cancelled

[gcode_macro DEFAULT_LOAD_FILAMENT]
description: Load filament at a bounded speed while the nozzle is hot
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before loading filament")}
    {% endif %}
    M83
    G1 E50 F300
    G92 E0

[gcode_macro DEFAULT_UNLOAD_FILAMENT]
description: Unload filament at a bounded speed while the nozzle is hot
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before unloading filament")}
    {% endif %}
    M83
    G1 E5 F300
    G1 E-65 F900
    G92 E0

[gcode_macro PRINTING_UNLOAD_FILAMENT]
description: Compatibility alias for the touchscreen unload action
gcode:
    DEFAULT_UNLOAD_FILAMENT

[gcode_macro M600]
description: Pause safely for a filament change without automatic unloading
gcode:
    {% if printer.pause_resume.is_paused %}
        {action_respond_info("Print paused for filament change")}
    {% else %}
        PAUSE
    {% endif %}

[gcode_macro PAUSE_UNLOAD_FILAMENT]
description: Pause, then unload after the park move completes
gcode:
    PAUSE
    DEFAULT_UNLOAD_FILAMENT

[gcode_macro LOAD_FILAMENT_RESUME]
description: Load filament, then resume a paused print
gcode:
    DEFAULT_LOAD_FILAMENT
    RESUME

[gcode_macro M109]
gcode:
    M99109{% for key in params %} {key}{params[key]}{% endfor %}

[gcode_macro M190]
gcode:
    M99190{% for key in params %} {key}{params[key]}{% endfor %}
